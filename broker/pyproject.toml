[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-request-broker"
version = "0.1.0"
description = "A deny-by-default, scope-authorized HTTP request broker"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "cryptography>=42,<47"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
broker = "broker.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]